{
    "name": "pull-request",
    "on": {
        "push": { "branches": "main" },
        "pull_request": { "branches": "main" },
    },
    "jobs": {
        "linux": {
            "runs-on": "ubuntu-latest",
            "strategy": {
                "fail-fast": false,
                "matrix": {
                    "container": [
                        "f43", "f44", "f45", "centos9", "centos10",
                    ],
                },
            },
            "container": "vathpela/efi-ci:${{ matrix.container }}-x64",
            "steps": [
                { "uses": "actions/checkout@v3" },
                { "run": "make V=1 all test" },
                { "run": "make V=1 abicheck" },
                { "run": "make V=1 clean fuzz-efisec MAX_FUZZ_RUNS=1024 MAX_FUZZ_TIME=60" },
                { "run": "make V=1 clean fuzz-efidp-format MAX_FUZZ_RUNS=1024 MAX_FUZZ_TIME=60" },
            ],
        },
    },
}
